apiVersion: apps/v1
kind: Deployment
metadata: {name: fixture}
spec:
  selector: {matchLabels: {app: fixture}}
  template:
    metadata: {labels: {app: fixture}}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            initialDelaySeconds: {{ .Values.readinessDelay }}
