# .github/dependabot.yml — adjust directories to match .factory.yml.
version: 2
updates:
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: weekly }, groups: { actions: { patterns: ["*"] } }, commit-message: { prefix: ci } }
  - { package-ecosystem: pip, directory: /, schedule: { interval: weekly }, groups: { python-minor: { update-types: [minor, patch] } }, commit-message: { prefix: build, include: scope } }
  - { package-ecosystem: npm, directory: /web, schedule: { interval: weekly }, groups: { npm-minor: { update-types: [minor, patch] } }, commit-message: { prefix: build, include: scope } }
  - { package-ecosystem: docker, directory: /, schedule: { interval: weekly }, commit-message: { prefix: build } }
  - { package-ecosystem: terraform, directory: /infra, schedule: { interval: weekly }, commit-message: { prefix: build } }
