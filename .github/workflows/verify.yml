name: factory verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: factory-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: '1.24.2', cache: false }
      - name: Install verification tools
        env:
          GOSUMDB: sum.golang.org
        run: |
          go install github.com/mikefarah/yq/v4@v4.45.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          python -m pip install 'zizmor==1.28.0'
          # Git, Bash, jq and ShellCheck are supplied by the hosted Ubuntu runner.
      - run: bash scripts/check.sh
