name: factory verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: factory-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.24.2', cache: false }
      - name: Install verification tools
        env:
          GOSUMDB: sum.golang.org
        run: |
          go install github.com/mikefarah/yq/v4@v4.45.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          python -m pip install 'zizmor==1.28.0'
          # Git, Bash, jq and ShellCheck are supplied by the hosted Ubuntu runner.
      - run: bash scripts/check.sh
